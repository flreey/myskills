interface:
  display_name: "Site Idea"
  short_description: "GEO 新页面空间验证：需求地图、问题库、任务空间、AI 答案缺口和我们是否出现，决定做、缩小范围还是放弃"
  default_prompt: "Use $site-idea on this idea: map the real demand first, expand each need into questions from several angles, model the task space, sample conversations, prepare the probe sheet, judge the answers I paste back for gaps and whether we appear, and report so I can decide go, narrow or stop."
